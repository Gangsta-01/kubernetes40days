apiVersion: v1
kind: Pod
metadata:
  labels:
    run: redis
  name: redis-test
spec:
  containers:
  - image: redis
    name: redis
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "false"
    effect: "NoSchedule"
status: {}
