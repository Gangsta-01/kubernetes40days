# Multi Container Pod
apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-pod
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    command: ['sh','-c','echo The app is running! && sleep 3600']
    env:
    - name: FIRSTNAME
      value: "Vaibhav"
  initContainers:
  - name: init-myservice
    image: busybox:1.28
    command: ['sh' , '-c']
    args: ['until nslookup myservice.default.svc.cluster.local; do echo waiting for myservice to be up; sleep 2; done']
  - name: init-mydb
    image: busybox:1.28
    command: ['sh' , '-c']
    args: ['until nslookup mydb.default.svc.cluster.local; do echo waiting for mydb to be up; sleep 2; done']