apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-pod
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    env:
    - name: FIRSTNAME
      valueFrom:
        configMapKeyRef:
          name: cn-new
          key: firstname
    - name: LASTNAME
      valueFrom:
        configMapKeyRef:
          name: cn-new
          key: lastname
    command: ['sh','-c','echo The app is running! && sleep 3600']
